name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            package: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            package: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/htmlrebase out/htmlrebase-${{ matrix.package }}

      - uses: actions/upload-artifact@v4
        with:
          name: htmlrebase-${{ matrix.package }}
          path: out/*

  verify:
    name: Verify the released binary
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: htmlrebase-linux-x64
          path: bin
      - name: Make it runnable
        run: chmod +x bin/htmlrebase-linux-x64

      - name: It runs
        run: ./bin/htmlrebase-linux-x64 --version

      # A static-pie is still static, but ldd does not say so: ask `file` instead.
      - name: It is statically linked
        run: |
          file bin/htmlrebase-linux-x64
          file bin/htmlrebase-linux-x64 | grep -qE 'static-pie linked|statically linked' \
            || { echo "the binary is dynamically linked"; exit 1; }

      - name: It rebases a real site
        run: |
          mkdir -p site/css
          echo '<link rel="stylesheet" href="/css/a.css"><a href="//cdn.example.com/x">x</a>' > site/index.html
          echo 'body { background: url("/a.png") }' > site/css/a.css
          ./bin/htmlrebase-linux-x64 site --prefix repo
          grep -q 'href="/repo/css/a.css"' site/index.html
          grep -q 'href="//cdn.example.com/x"' site/index.html
          grep -q 'url("/repo/a.png")' site/css/a.css
          echo "--- second run must change nothing ---"
          ./bin/htmlrebase-linux-x64 site --prefix repo | grep -q '0 of 2 files changed'

  release:
    name: Publish the GitHub release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release && sha256sum htmlrebase-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
